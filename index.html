<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngôi Sao Sáng Nhất · 20/10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@1,500;1,600&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed canvas stage. Captions sit low and centered, the hint pill at the top, the skip control bottom-left. The letter opens as a centered overlay. */
:root {
  --ink: #130d33;
  --violet: #5a3b9c;
  --lilac: #d4c2fa;
  --paper: #faf4ff;
  --glass: rgba(24, 16, 58, 0.45);
  --line: rgba(236, 224, 255, 0.4);
  --parchment: #fffdf5;
  --cocoa: #44385a;
  --display: 'Playfair Display', 'Times New Roman', serif;
  --body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--body);
  overflow: hidden;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.ui {
  position: fixed; inset: 0; z-index: 5;
  box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: max(18px, env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top { display: flex; justify-content: center; }
.bottom { display: flex; flex-direction: column; gap: 22px; }

.hint {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 10px 18px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-size: 15px; font-weight: 500; letter-spacing: 0.01em;
  opacity: 0; transform: translateY(-8px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.hint.in { opacity: 1; transform: none; }
.hint .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--lilac);
  box-shadow: 0 0 0 0 rgba(212, 194, 250, 0.7);
  animation: ping 1.8s ease-out infinite;
}
@keyframes ping { to { box-shadow: 0 0 0 12px rgba(212, 194, 250, 0); } }

.caption {
  margin: 0 auto; max-width: min(30ch, 100%);
  text-align: center; text-wrap: balance;
  font-family: var(--display); font-style: italic; font-weight: 500;
  font-size: clamp(22px, 4.6vw, 34px); line-height: 1.38;
  color: #fbf6ff;
  text-shadow: 0 2px 22px rgba(24, 12, 70, 0.8);
  min-height: 2.8em;
  transition: opacity 0.45s ease;
}
.caption .w { display: inline-block; opacity: 0; white-space: pre; }
.caption.in .w { animation: rise 1s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i) * 75ms); }
@keyframes rise {
  from { opacity: 0; transform: translateY(10px); filter: blur(5px); }
  to { opacity: 1; transform: none; filter: blur(0); }
}

.row { display: flex; align-items: center; }
.skip {
  pointer-events: auto; cursor: pointer;
  font: 500 15px var(--body); color: var(--paper);
  padding: 9px 18px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: opacity 0.6s ease, background 0.2s ease;
}
.skip:hover { background: rgba(60, 40, 120, 0.55); }
.skip.gone { opacity: 0; pointer-events: none; }
.skip:focus-visible, #starBtn:focus-visible, #doveBtn:focus-visible, .close:focus-visible { outline: 2px solid var(--lilac); outline-offset: 4px; }

#starBtn, #doveBtn {
  position: fixed; left: 0; top: 0; z-index: 6; padding: 0; border: 0;
  background: transparent; cursor: pointer; -webkit-tap-highlight-color: transparent;
  will-change: transform;
}
#starBtn { width: 120px; height: 120px; border-radius: 50%; }
#doveBtn { width: 200px; height: 120px; border-radius: 50%; }
#starBtn:disabled, #doveBtn:disabled { pointer-events: none; }

/* ---- letter ---- */
.mail { position: fixed; inset: 0; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
.mail.on { opacity: 1; pointer-events: auto; }
.scrim {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(16, 44, 98, 0.5), rgba(8, 18, 56, 0.82));
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.slot { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }

.env {
  --w: min(78vw, 340px);
  position: relative; width: var(--w); height: calc(var(--w) * 0.68);
  perspective: 900px;
  transform: translate(var(--fx, 0px), var(--fy, 0px)) scale(0.2) rotate(14deg);
  opacity: 0;
  transition: transform 1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
}
.mail.on .env { transform: none; opacity: 1; }
.env-back { position: absolute; inset: 0; border-radius: 8px; z-index: 1; background: linear-gradient(#f1dcb0, #e6c996); box-shadow: 0 26px 60px rgba(0, 20, 70, 0.5); }
.pv {
  position: absolute; left: 8%; right: 8%; top: 14%; height: 80%; z-index: 2; border-radius: 4px;
  background: var(--parchment) repeating-linear-gradient(transparent 0 17px, rgba(120, 150, 200, 0.2) 17px 18px);
  box-shadow: 0 2px 8px rgba(40, 30, 10, 0.18);
  transition: transform 1s cubic-bezier(0.3, 0.7, 0.2, 1);
}
.mail.rise .pv { transform: translateY(-58%); }
.env-front {
  position: absolute; inset: 0; z-index: 3; border-radius: 8px;
  background: linear-gradient(160deg, #fcedcc, #eed5a2);
  clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
}
.env-lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
.flap {
  position: absolute; left: 0; right: 0; top: 0; height: 54%; z-index: 4;
  transform-origin: top center;
  background: linear-gradient(#f6e3bc, #e4c692);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: transform 0.8s ease;
}
.seal { position: absolute; left: 50%; top: 66%; width: 28px; height: 28px; transform: translate(-50%, -50%); }
.mail.open .flap { transform: rotateX(180deg); z-index: 0; transition: transform 0.8s ease, z-index 0s 0.4s; }
.mail.read .env { transform: translateY(34vh) scale(0.8); opacity: 0; transition: transform 0.9s ease, opacity 0.8s ease; }

.letter {
  position: relative; box-sizing: border-box; width: min(88vw, 370px);
  padding: 30px 26px 22px; border-radius: 4px;
  background: var(--parchment) repeating-linear-gradient(transparent 0 33px, rgba(120, 150, 200, 0.16) 33px 34px);
  color: var(--cocoa);
  box-shadow: 0 30px 80px rgba(0, 25, 80, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
  opacity: 0; transform: translateY(60px) scale(0.86);
  transition: opacity 0.9s ease 0.15s, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s;
}
.mail.read .letter { opacity: 1; transform: none; pointer-events: auto; }
.letter h2 { margin: 0 0 14px; font: italic 600 25px/1.25 var(--display); color: var(--violet); text-wrap: balance; }
.letter p { margin: 0 0 12px; font: italic 500 18px/1.7 var(--display); text-wrap: pretty; }
.letter .sign { text-align: right; margin: 18px 0 0; color: var(--violet); }
.close {
  display: block; margin: 20px 0 0 auto; cursor: pointer;
  font: 500 14px var(--body); color: #fff; padding: 9px 22px; border: 0; border-radius: 999px;
  background: var(--violet); transition: background 0.2s ease;
}
.close:hover { background: #6e4cb6; }

@media (prefers-reduced-motion: reduce) {
  .hint .dot { animation: none; }
  .env, .pv, .flap, .letter { transition-duration: 0.01s; transition-delay: 0s; }
}

/* ===== v2: tân trang giao diện + lớp sương ===== */
:root{--hand:'Dancing Script','Be Vietnam Pro',cursive;--gold:#d9b46a;--rose:#ff9fc4}
body::after{content:'';position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(6,3,24,.55))}
#fog{position:fixed;inset:0;width:100%;height:100%;z-index:4;opacity:0;transition:opacity .6s ease;touch-action:none;cursor:none}
#fog.show{opacity:1}#fog.gone{opacity:0;pointer-events:none;transition:opacity 1.8s ease}
.brush{position:fixed;left:0;top:0;z-index:7;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .3s;border:1.5px solid rgba(255,255,255,.6);box-shadow:0 0 26px rgba(200,175,255,.45),inset 0 0 22px rgba(255,255,255,.2)}
.brush.on{opacity:1}
.hint{position:relative;padding:11px 24px 15px;border-color:rgba(255,226,240,.32);background:linear-gradient(135deg,rgba(52,32,104,.6),rgba(24,16,58,.42));box-shadow:0 12px 42px -14px rgba(140,90,240,.7),inset 0 1px 0 rgba(255,255,255,.14)}
.hint::after{content:'';position:absolute;left:24px;right:24px;bottom:6px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--rose),var(--lilac)) left/calc(var(--p,0)*1%) 100% no-repeat,rgba(255,255,255,.14);opacity:var(--bar,0);transition:opacity .5s}
.hint.fog{--bar:1}
.hint .dot{background:var(--rose);animation-name:ping2}@keyframes ping2{to{box-shadow:0 0 0 12px rgba(255,159,196,0)}}
.caption{font-size:clamp(24px,5vw,40px);text-shadow:0 0 30px rgba(190,150,255,.6),0 2px 22px rgba(24,12,70,.9)}
.skip{font-size:13px;padding:8px 16px;opacity:.85;border-color:rgba(255,255,255,.28)}
.letter{padding:36px 28px 24px;width:min(88vw,380px);background:var(--parchment) repeating-linear-gradient(transparent 0 35px,rgba(150,120,170,.13) 35px 36px);box-shadow:0 34px 90px rgba(10,5,50,.65),inset 0 0 60px rgba(217,180,106,.2),inset 0 0 0 1px rgba(255,255,255,.7)}
.letter::before{content:'';position:absolute;inset:9px;border:1px solid rgba(199,154,75,.6);outline:1px solid rgba(199,154,75,.25);outline-offset:3px;pointer-events:none}
.letter>*{position:relative}
.letter h2{font:700 34px/1.1 var(--hand);color:#8a2b52;text-align:center;margin-bottom:16px}
.letter p{font:500 22px/1.5 var(--hand);color:#3f2f55}
.letter .sign{font-size:24px;color:#8a2b52}
.close{background:linear-gradient(135deg,#8a2b52,#5a3b9c);box-shadow:0 8px 20px -8px rgba(90,59,156,.8)}
.mail.read .letter>*{animation:ink 1s ease both}
.letter>:nth-child(1){animation-delay:.5s!important}.letter>:nth-child(2){animation-delay:1.1s!important}.letter>:nth-child(3){animation-delay:1.8s!important}.letter>:nth-child(4){animation-delay:2.5s!important}.letter>:nth-child(5){animation-delay:3s!important}
@keyframes ink{from{opacity:0;transform:translateY(8px);filter:blur(4px)}}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:25;background:#efe3cc;opacity:0;visibility:hidden;transition:opacity 1.2s ease}
#site.on{opacity:1;visibility:visible}
.musicBtn[hidden]{display:none}.musicBtn{position:fixed;top:12px;right:12px;z-index:60;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(40,24,90,.6);color:#fff;font:20px/1 sans-serif;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:0}
.musicBtn.off{opacity:.7}.musicBtn.off::after{content:'';position:absolute;left:50%;top:50%;width:26px;height:2px;margin:-1px 0 0 -13px;background:#fff;border-radius:2px;transform:rotate(-45deg)}
#flash{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .9s ease;background:radial-gradient(circle at 50% 50%,#fff,#fff0f8 60%,#ffe3f1)}
#flash.on{opacity:1}
.siteOn .ui,.siteOn #starBtn,.siteOn #doveBtn,.siteOn #stage,.siteOn #fog,.siteOn .mail,.siteOn .brush{display:none}

/* ===== tối ưu: bầu trời bằng lớp DOM (compositor) + chim dựng sẵn thành sprite ===== */
#skyBack,#skyFront{position:fixed;inset:0;pointer-events:none;overflow:hidden;visibility:hidden;contain:strict}
#skyBack{z-index:1;background:#8bc5f5}#skyFront{z-index:2}
body.skyOn #skyBack,body.skyOn #skyFront,body.skyOn #doveWrap{visibility:visible}
.skybg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.cl{position:absolute;left:0;top:0;background-size:100% 100%;background-repeat:no-repeat;will-change:transform;pointer-events:none}
.mote{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,205,.55),rgba(255,240,205,0) 70%);opacity:0;animation:moteUp linear infinite;will-change:transform,opacity}
@keyframes moteUp{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate3d(0,-115vh,0);opacity:0}}
#doveWrap{position:fixed;left:0;top:0;z-index:2;pointer-events:none;visibility:hidden;will-change:transform}
#doveGlow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,250,235,.55),rgba(255,244,222,.14) 45%,rgba(255,255,255,0) 70%);opacity:.7;transition:opacity .3s}
#doveCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;transition:transform .25s ease;transform-origin:var(--ox,50%) var(--oy,50%)}
#doveWrap.hv #doveGlow{opacity:1}#doveWrap.hv #doveCv{transform:scale(1.05)}
#skyFlash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:#fffaff}
.fth,.spk{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}.fth{background-size:100% 100%}
.spk{width:8px;height:8px;margin:-4px;border-radius:50%;background:radial-gradient(circle,#fffbe8,rgba(255,236,190,0) 70%)}
.siteOn #skyBack,.siteOn #skyFront,.siteOn #doveWrap,.siteOn #skyFlash{display:none}

/* ===== thư: phong bì gọn, đẹp ===== */
.env-back{border-radius:10px;background:linear-gradient(180deg,#dfc182,#d3b06a)}
.pv{left:7%;right:7%;top:7%;height:88%;border-radius:5px;background:#fffdf6 repeating-linear-gradient(transparent 0 21px,rgba(150,120,170,.16) 21px 22px);box-shadow:0 2px 8px rgba(60,40,10,.2);transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.pv::before{content:'\2665';position:absolute;left:0;right:0;top:9%;text-align:center;font-size:26px;line-height:1;color:#e0527f}
.mail.rise .pv{transform:translateY(-52%)}
.env-front{border-radius:10px;background:linear-gradient(#f8e8c4,#efd8a2)}
.env-front::before{content:'';position:absolute;inset:0;clip-path:polygon(0 100%,50% 50%,100% 100%);background:linear-gradient(#f5e2b5,#ebd096)}
.env-front::after{content:'';position:absolute;inset:0;clip-path:polygon(0 0,50% 50%,0 100%,0 0,100% 0,50% 50%,100% 100%,100% 0);background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(190,140,70,.12) 50%,rgba(255,255,255,.22))}
.env-lines{display:none}
.flap{background:linear-gradient(180deg,#f4deaa,#e6c68a)}
.mail.open .flap{background:linear-gradient(0deg,#e3c386,#d7b676)}
.seal{width:32px;height:32px;filter:drop-shadow(0 2px 3px rgba(150,40,80,.4));transition:opacity .25s}
.mail.open .seal{opacity:0}
/* ===== giảm tải GPU ===== */
.hint,.skip{-webkit-backdrop-filter:none;backdrop-filter:none}
.skip{background:rgba(24,16,58,.62)}
.brush{box-shadow:none;background:rgba(255,255,255,.06)}
.dimg{position:absolute;left:var(--ox);top:var(--oy);transform:translate(-50%,-50%);max-width:none;display:block;transition:transform .25s;user-select:none;-webkit-user-drag:none}#doveWrap.hv .dimg{transform:translate(-50%,-50%) scale(1.05)}

/* nắp phong bì bo tròn (thư chim) */
.mail .env .flap{clip-path:polygon(4.84% 9.67%,3.68% 7.11%,2.96% 4.94%,2.68% 3.16%,2.85% 1.78%,3.46% 0.79%,4.51% 0.20%,6.00% 0.00%,94.00% 0.00%,95.49% 0.20%,96.54% 0.79%,97.15% 1.78%,97.32% 3.16%,97.04% 4.94%,96.32% 7.11%,95.16% 9.67%,57.26% 85.49%,55.18% 89.04%,53.11% 91.41%,51.04% 92.60%,48.96% 92.60%,46.89% 91.41%,44.82% 89.04%,42.74% 85.49%)}

/* ===== v6: thư chim - phong bì bo tròn, nắp mềm ===== */
.mail .env-back{border-radius:18px;background:linear-gradient(180deg,#e8cd90,#d6b36d);box-shadow:0 30px 60px rgba(0,20,70,.5),inset 0 0 0 1px rgba(255,255,255,.35)}
.mail .env-front{border-radius:18px;background:linear-gradient(180deg,#fbefd0,#f2dcaa)}
.mail .env-front::before{background:linear-gradient(180deg,#f7e6bb,#ecd299)}
.mail .env .flap{left:1%;right:1%;clip-path:polygon(9.67% 19.35%,7.59% 14.81%,6.19% 10.88%,5.47% 7.56%,5.42% 4.84%,6.05% 2.72%,7.35% 1.21%,9.34% 0.30%,12.00% 0.00%,88.00% 0.00%,90.66% 0.30%,92.65% 1.21%,93.95% 2.72%,94.58% 4.84%,94.53% 7.56%,93.81% 10.88%,92.41% 14.81%,90.33% 19.35%,62.90% 74.20%,59.67% 79.85%,56.45% 83.88%,53.22% 86.30%,50.00% 87.10%,46.78% 86.30%,43.55% 83.88%,40.33% 79.85%,37.10% 74.20%);background:linear-gradient(180deg,#f8e7bf,#ecd199);filter:drop-shadow(0 3px 4px rgba(90,60,10,.25))}
.mail.open .env .flap{background:linear-gradient(0deg,#fbefd0,#e9cd93)}
.mail .pv{border-radius:10px;box-shadow:0 3px 10px rgba(60,40,10,.25),inset 0 0 0 1px rgba(217,180,106,.55)}

/* ===== v7: dọn các mảng trắng thừa ===== */
.mail .env-front::after{display:none}
.mail .env .flap{filter:none}
.mail .env-back{box-shadow:0 30px 60px rgba(0,20,70,.5)}
.mail .env-front,.mail .env-front::before{border-radius:0 0 18px 18px}
.mail .pv{box-shadow:0 2px 8px rgba(60,40,10,.22);border-radius:8px 8px 4px 4px}

/* ===== v8: phong thư giấy kem như thật ===== */
.mail .env-back{border-radius:6px;background:linear-gradient(160deg,#e6d4a8,#d9c28f);box-shadow:0 28px 56px rgba(0,10,50,.5)}
.mail .pv{border-radius:3px;background:#fffdf7 repeating-linear-gradient(transparent 0 21px,rgba(150,120,90,.16) 21px 22px);box-shadow:0 1px 4px rgba(60,40,10,.25)}
.mail .env-front{border-radius:0 0 6px 6px;background:linear-gradient(170deg,#faf2da,#efe0b8)}
.mail .env-front::before{border-radius:0 0 6px 6px;background:linear-gradient(180deg,#f6ebcb,#ecdcb2)}
.mail .env-front::after{display:block;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(140,105,50,.07) 50%,rgba(255,255,255,.18))}
.mail .env .flap{left:0;right:0;border-radius:0;clip-path:polygon(1.61% 3.22%,1.27% 2.47%,1.03% 1.81%,0.91% 1.26%,0.90% 0.81%,1.01% 0.45%,1.23% 0.20%,1.56% 0.05%,2.00% 0.00%,98.00% 0.00%,98.44% 0.05%,98.77% 0.20%,98.99% 0.45%,99.10% 0.81%,99.09% 1.26%,98.97% 1.81%,98.73% 2.47%,98.39% 3.22%,54.84% 90.33%,53.63% 92.44%,52.42% 93.95%,51.21% 94.86%,50.00% 95.16%,48.79% 94.86%,47.58% 93.95%,46.37% 92.44%,45.16% 90.33%);background:linear-gradient(180deg,#fdf7e4,#f1e4c0);filter:drop-shadow(0 3px 3px rgba(90,65,20,.3))}
.mail.open .env .flap{background:linear-gradient(0deg,#f4e8c8,#decb9b);filter:none}
</style>

</head><body>
<canvas id="stage" aria-hidden="true"></canvas>

<div id="skyFront" aria-hidden="true"></div>
<div id="skyFlash"></div>

<button id="musicBtn" class="musicBtn off" type="button" aria-label="Bật/tắt nhạc" aria-pressed="false">♪</button>
<div class="ui">

  </div>
</div>

<div id="mail" class="mail" role="dialog" aria-label="Lá thư" aria-hidden="true">

  <div class="slot">
    <div class="env">

/* thanh điều hướng kính mờ */
.dots{background:rgba(255,250,242,.7);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid rgba(201,161,90,.55);box-shadow:0 14px 30px -14px rgba(90,22,38,.5);gap:10px}
.dots button{width:9px;height:9px;padding:0;border:0;border-radius:99px;background:rgba(90,22,38,.25);transition:width .45s var(--ease),background .3s}.dots button:hover{transform:none;background:var(--red)}.dots .on{width:26px;transform:none;background:linear-gradient(90deg,var(--wine),var(--red))}
/* admin */
.ac{border:1px solid var(--hair);box-shadow:var(--lift)}.adm aside button.on{box-shadow:0 8px 18px -8px #0008}

/* ===== v9: vũ trụ mở đầu ===== */
.cos{position:absolute;inset:0;z-index:9;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#4a1230 0,#220a18 45%,#0b0309 100%);transition:opacity .9s ease,visibility 0s .9s}.cos.fade{opacity:0;visibility:hidden;pointer-events:none}.cos canvas{position:absolute;inset:0;width:100%;height:100%}
.cttl{position:absolute;left:50%;top:11%;translate:-50% 0;width:min(86vw,26em);text-align:center;color:#f6e6c8;font-size:clamp(1.05rem,3.6vw,1.45rem);text-shadow:0 2px 14px #000a}
.ccap{position:absolute;left:0;right:0;bottom:17%;text-align:center;color:#ffe2a8;text-shadow:0 2px 12px #000a;animation:capb 2.2s ease-in-out infinite}@keyframes capb{50%{opacity:.45}}
.cos.go .cttl,.cos.go .ccap{opacity:0;transition:opacity .6s}
.orb{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:2}.orb i{position:absolute;inset:0;border-radius:50%}
.orb .o1{inset:30%;background:radial-gradient(circle at 35% 30%,#fff,#ffe2a8 40%,#e9a07a 80%);box-shadow:0 0 30px 10px rgba(255,214,150,.65),0 0 80px 24px rgba(233,120,140,.4);animation:orbp 2.4s ease-in-out infinite}
.orb .o2,.orb .o3{border:1px solid rgba(255,226,170,.7);animation:orbr 2.8s ease-out infinite}.orb .o3{animation-delay:1.4s}
@keyframes orbp{50%{transform:scale(1.18)}}@keyframes orbr{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.orb.go{pointer-events:none}.orb.go .o1{animation:orbg 2.4s ease-in forwards}.orb.go .o2,.orb.go .o3{animation:none;opacity:0}@keyframes orbg{0%{transform:scale(1)}100%{transform:scale(4.2)}}
.skip{position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;padding:.4em .95em;border:1px solid rgba(255,226,170,.4);border-radius:99px;background:rgba(0,0,0,.2);color:#ecd9ab;font:500 .8rem var(--sans);cursor:pointer}
.flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#fff 0,#ffe7b8 18%,rgba(255,200,140,0) 62%)}.flash.on{animation:fl 1.1s ease-out forwards}@keyframes fl{0%{opacity:0;transform:scale(.2)}25%{opacity:1}100%{opacity:0;transform:scale(2.4)}}
.env.arrive{animation:arrive 1.3s var(--ease) backwards}@keyframes arrive{0%{opacity:0;transform:scale(.3) rotate(-10deg);filter:brightness(2.4) blur(6px)}60%{opacity:1;filter:brightness(1.3)}100%{opacity:1;transform:none;filter:none}}
.arr>p{animation:rise 1s var(--ease) .45s backwards}@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* ===== v10: tông tối, hồng-trắng kiểu roll ===== */
.cos{background:radial-gradient(ellipse at 50% 50%,#1b0a15 0,#0a0408 52%,#020101 100%)}
.cos .dawn{display:block;position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 50%,#fff 0,#ffe8f1 28%,#f8b6cd 65%,#d9688f 100%);transition:opacity .6s}.cos.burst .dawn{opacity:1}
.cttl{color:#e7dbe2}.ccap{color:#e8c9d6}
.orb .o1{background:radial-gradient(circle at 35% 30%,#fff,#e9d6df 45%,#9a6a80 85%);box-shadow:0 0 26px 8px rgba(255,235,244,.45),0 0 70px 20px rgba(200,90,130,.3)}
.orb .o2,.orb .o3{border-color:rgba(255,220,235,.55)}
.orb.go .o1{background:radial-gradient(circle at 35% 30%,#fff,#ffd0e2 45%,#ff7fae 85%);box-shadow:0 0 30px 10px rgba(255,200,225,.85),0 0 90px 30px rgba(255,120,175,.55)}
.flash{background:radial-gradient(circle at 50% 50%,#fff 0,#ffe3ee 22%,rgba(255,170,205,0) 62%)}
.skip{border-color:rgba(255,220,235,.35);color:#e8c9d6}

/* ===== v11: quả cầu và phong thư cùng tông hồng-trắng ===== */
#intro{background:radial-gradient(ellipse at 50% 38%,#fff 0,#ffeaf2 48%,#f7c6d7 100%)}
.orb .o1{display:grid;place-items:center;font:700 .85rem/1 var(--serif);color:#5a1626;background:radial-gradient(circle at 35% 30%,#fff,#ffd8e6 45%,#d98ab0 88%);box-shadow:0 0 26px 8px rgba(255,225,238,.5),0 0 70px 20px rgba(200,90,130,.35)}
.orb.go .o1{background:radial-gradient(circle at 35% 30%,#fff,#ffd0e2 45%,#ff7fae 88%)}
.env .seal,.mail b{background:radial-gradient(circle at 35% 30%,#fff,#ffd0e2 45%,#ff7fae 88%);color:#5a1626;border:0;box-shadow:0 0 0 3px rgba(255,255,255,.65),0 8px 18px -6px rgba(200,70,120,.7),0 0 24px 4px rgba(255,170,205,.5)}
.env.arrive .seal{animation:sealglow 1.8s ease-out}@keyframes sealglow{0%{box-shadow:0 0 0 3px #fff,0 0 80px 40px rgba(255,170,205,.95)}100%{box-shadow:0 0 0 3px rgba(255,255,255,.65),0 8px 18px -6px rgba(200,70,120,.7),0 0 24px 4px rgba(255,170,205,.5)}}

/* ===== v12: quả cầu thu lại thành điểm sáng thay vì phình to ===== */
.orb.go .o1{animation:orbg2 2.4s ease-in forwards}@keyframes orbg2{0%{transform:scale(1)}35%{transform:scale(1.2)}100%{transform:scale(.12)}}
.cos.burst .orb{opacity:0;transition:opacity .25s}

/* ===== v13: chữ ở màn vũ trụ nhẹ nhàng hơn ===== */
.cttl,.ccap{font-weight:500;letter-spacing:.03em}.cttl{font-size:clamp(1rem,3vw,1.3rem);line-height:1.55}.ccap{font-size:1rem;letter-spacing:.05em}

/* ===== v14: bầu trời đêm tím chàm, ánh hồng sạch ===== */
.cos{background:radial-gradient(ellipse 110% 85% at 50% 48%,#26103f 0,#120a2b 42%,#06030f 100%)}
.cos::before{content:'';position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(46% 34% at 50% 50%,rgba(255,110,170,.12),transparent 72%),radial-gradient(40% 30% at 14% 12%,rgba(110,90,230,.16),transparent 70%),radial-gradient(36% 28% at 88% 90%,rgba(190,80,200,.12),transparent 70%)}
.cos::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(2,1,8,.5) 100%);transition:opacity .4s}.cos.burst::after{opacity:0}
.cttl,.ccap{z-index:2}.cttl{line-height:1.7;text-wrap:balance;color:#f3e9f7;text-shadow:0 2px 16px #000b}.ccap{letter-spacing:.12em;color:#f3c6da;text-shadow:0 2px 14px #000b}
.orb::before{content:'';position:absolute;inset:-85%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,200,228,.5) 0,rgba(255,130,190,.3) 16%,rgba(255,110,180,.12) 34%,rgba(255,110,180,.03) 52%,transparent 68%);animation:orbh 5s ease-in-out infinite}@keyframes orbh{50%{transform:scale(1.12);opacity:.75}}.orb.go::before{animation:none;opacity:0;transition:opacity .5s}
.orb .o1{box-shadow:0 0 22px 6px rgba(255,225,240,.55),0 0 60px 16px rgba(255,120,185,.4)}
.skip{padding:.6em 1.15em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:reduce){.orb::before{animation:none}}

/* ===== v15: chữ đẹp hơn (Playfair Display + Dancing Script + Be Vietnam Pro) ===== */
body{font-variant-numeric:lining-nums;font-kerning:normal;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
h1{line-height:1.08;letter-spacing:-.02em}h2{line-height:1.14;letter-spacing:-.015em}h3{line-height:1.22}
.hand,.env .card,.env .addr,.slip,.cell.pt::before,.sig,.pol figcaption,.mail,.type,.bub,.hcap{font-size-adjust:.44;letter-spacing:0}
.cttl{font-size:clamp(1.1rem,3.3vw,1.4rem);font-weight:600;letter-spacing:0;line-height:1.5}.ccap{font-size:1.1rem;font-weight:600;letter-spacing:.02em}


/* ===== v16: tân trang tổng thể — sang, mềm, đậm chất quà tặng ===== */
:root{
  --paper:#f6ecdd; --paper2:#fffaf1; --kraft:#e3cba6;
  --blush:#f3c6bf; --blush2:#f9ddd7;
  --wine:#6d1f33; --wine2:#8a2b44; --ink:#2b2020;
  --gold:#c9a15a; --gold2:#e8cf9a; --red:#c22f4b;
  --rose:#ff9fc4;
  --hair:rgba(109,31,51,.13);
  --lift:0 30px 60px -28px rgba(109,31,51,.45),0 4px 14px rgba(109,31,51,.08);
  --ease:cubic-bezier(.22,.9,.28,1);
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(60% 40% at 85% 0%,#f9e3d8 0%,transparent 60%),
    radial-gradient(50% 35% at 0% 20%,#f3e2c8 0%,transparent 55%),
    var(--paper);
  letter-spacing:.005em;
}
::selection{background:var(--wine);color:#fff4e4}
::-webkit-scrollbar{width:11px}
::-webkit-scrollbar-track{background:#efe2cf}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--wine));border-radius:99px;border:3px solid #efe2cf}

/* lớp viền trang kiểu thiệp */
body:not(.adm)::before{
  inset:12px;border-radius:22px;
  border:1.5px solid rgba(201,161,90,.55);
  box-shadow:inset 0 0 0 4px rgba(255,250,240,.5);
}
body:not(.adm)::after{opacity:.22}

/* ---- chữ ---- */
h1,h2{letter-spacing:-.02em}
h1 em,h2 em{
  background:linear-gradient(92deg,var(--red),#d9835f 30%,var(--wine) 60%,var(--red));
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite;
}
@keyframes shine{to{background-position:220% 0}}
.hand{
  display:inline-flex;align-items:center;gap:.55em;
  letter-spacing:.02em;
}
.hand::before,.hand::after{content:'✦';font-size:.72em;color:var(--gold);opacity:.85}
.hd .hand::before,.hd .hand::after{content:'❀'}
em{background:linear-gradient(transparent 60%,rgba(243,198,191,.85) 60%)}

/* ---- nút ---- */
.btn{
  background:linear-gradient(135deg,var(--wine2),var(--wine) 55%,#521627);
  border:1px solid var(--gold);
  box-shadow:0 14px 26px -12px rgba(109,31,51,.75),inset 0 1px 0 rgba(255,255,255,.28);
  letter-spacing:.04em;text-transform:uppercase;font-size:.86rem;
  padding:1em 2em;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),filter .3s;
}
.btn:hover{transform:translateY(-3px);filter:brightness(1.07);box-shadow:0 20px 32px -12px rgba(109,31,51,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(-1px) scale(.98)}
.link{color:var(--wine);font-weight:600;text-decoration-color:var(--gold);text-underline-offset:5px}
.link:hover{color:var(--red)}

/* ---- màn vũ trụ + phong thư mở đầu ---- */
.cos{background:radial-gradient(ellipse 120% 90% at 50% 45%,#2a1146 0,#150b30 45%,#07040f 100%)}
#intro{background:radial-gradient(ellipse at 50% 34%,#fff 0,#ffeef3 45%,#f6cdd9 100%)}
.env{
  border-radius:10px;
  box-shadow:0 34px 50px -24px rgba(43,32,32,.55),0 4px 10px rgba(43,32,32,.15);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease);
}
.env:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 44px 60px -24px rgba(43,32,32,.6),0 6px 14px rgba(43,32,32,.18)}
.env .card{border-radius:6px;box-shadow:0 3px 10px rgba(43,32,32,.18)}
.env .flap{background:linear-gradient(180deg,#f6cfc6,#e7ada2)}
.env.open .flap{background:linear-gradient(180deg,#eba99e,#d98f85)}
.env .seal,.mail b{
  background:radial-gradient(circle at 32% 28%,#ffd7e4,#ff8fb4 55%,#e0527f);
  color:#5c1030;font-weight:700;border:0;
  box-shadow:0 0 0 3px rgba(255,255,255,.7),0 10px 20px -6px rgba(200,60,110,.65),0 0 26px 6px rgba(255,150,190,.5);
}

/* ---- panel mật mã ---- */
.panel{
  background:
    radial-gradient(#6d1f3312 1.1px,transparent 1.5px) 0 0/13px 13px,
    linear-gradient(165deg,#fffdf7,#f8ecd9);
  border:1px solid rgba(201,161,90,.7);
  box-shadow:0 50px 90px -35px rgba(109,31,51,.6),0 6px 18px rgba(109,31,51,.1),inset 0 1px 0 #fff;
  outline:1px solid rgba(201,161,90,.5);outline-offset:-11px;
}
.panel::before{border:0;box-shadow:none}
.lock{
  background:radial-gradient(circle at 30% 25%,#fff,#f6cfc6 65%,#eab3aa);
  border:1px solid var(--gold);box-shadow:0 16px 28px -12px rgba(109,31,51,.55),inset 0 1px 0 #fff;
}
.box input{
  background:#fffdf8;border:1.5px solid rgba(109,31,51,.25);
  box-shadow:inset 0 2px 10px rgba(109,31,51,.07);
}
.box input:focus{border-color:var(--gold);box-shadow:0 0 0 5px rgba(201,161,90,.25),inset 0 2px 10px rgba(109,31,51,.05)}
.tries i{border-color:rgba(109,31,51,.4)}
.msg{font-weight:600}

/* ---- khung section & sóng ---- */
.sec{padding-block:clamp(72px,12vh,130px)}
.wave{height:clamp(40px,7vw,74px)}
#cal.sec{
  background:
    radial-gradient(circle at 12% 18%,#f9d9cd66 0 12%,transparent 13%),
    radial-gradient(circle at 88% 8%,#e8cf9a55 0 9%,transparent 10%),
    radial-gradient(circle at 78% 82%,#c22f4b1f 0 14%,transparent 15%),
    radial-gradient(circle at 22% 88%,#c9a15a2e 0 8%,transparent 9%),
    linear-gradient(180deg,#f8efdf,#f3e6d0);
}
.hd h1{max-width:16em}

/* ---- lịch ---- */
.cp{
  background:linear-gradient(165deg,#fffdf8,#f9efdd);
  border:1px solid var(--hair);outline:1px solid rgba(201,161,90,.5);outline-offset:-12px;
  box-shadow:var(--lift);border-radius:26px;
}
.rings i{background:linear-gradient(90deg,#8a6a3a,#eed9a4 50%,#8a6a3a);box-shadow:0 3px 5px rgba(0,0,0,.28)}
.grid{border:1px solid rgba(201,161,90,.6);border-radius:16px;overflow:hidden;box-shadow:inset 0 2px 8px rgba(109,31,51,.06)}
.wd{background:linear-gradient(180deg,#fbf2e2,#f5e6cd);letter-spacing:.22em}
.cell{border-color:rgba(109,31,51,.08);border-radius:0}
.cell>span{font-family:var(--serif);font-weight:600;font-size:1.12rem}
.cell:hover{background:#f3c6bf59}
.cell.hl{background:color-mix(in srgb,var(--c) 13%,#fff)}
.cell.ms{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));text-shadow:0 1px 3px rgba(0,0,0,.25)}
.cell.td>span{border-bottom:3px double var(--red)}
.cell.sel{outline:0;box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 6px rgba(201,161,90,.22);background:#fff8ec}
.cell.pt{animation:pr 2s ease-out infinite}
.cell.pt::before{content:'✦';color:#fff;text-shadow:0 0 8px #ff5c8a;animation:tw 1.3s ease-in-out infinite}

/* ---- bảng ngày bên trái ---- */
.dp{
  background:linear-gradient(165deg,#fffdf8,#f7ebd6);
  border:1px solid var(--hair);outline:1px solid rgba(201,161,90,.5);outline-offset:-12px;
  box-shadow:var(--lift);border-radius:26px;
}
.num{background-size:96% 96%;color:var(--wine)}
.slip{
  background:linear-gradient(160deg,#fff,#fff8ee);
  border-left:8px solid var(--dc,var(--blush));
  box-shadow:0 10px 18px -10px rgba(43,32,32,.35);
  border-radius:4px 10px 10px 4px;
}
.tagp{background:linear-gradient(135deg,#fffaf0,#f3e2c2);border-color:var(--gold);letter-spacing:.09em}
.hintpill{border:1.5px dashed var(--red);background:#fffdf8;color:var(--wine);box-shadow:0 10px 22px -12px rgba(109,31,51,.5)}
.cue{border:1px solid var(--gold);background:linear-gradient(135deg,#fffaf0,#f3e2c2);color:var(--wine)}

/* ---- lỜi chúc ---- */
.ww .wl{
  border:1px solid var(--hair);outline:1px solid rgba(201,161,90,.5);outline-offset:-12px;
  background:linear-gradient(165deg,#fffdf8,#f8efdd);
  box-shadow:var(--lift);border-radius:26px;
}
.ww .wl::before{color:rgba(201,161,90,.4);top:-.18em}
.sig{font-size:2rem}

/* ---- album polaroid ---- */
.s-kraft{background:repeating-linear-gradient(45deg,#0000 0 7px,#8a6a3a10 7px 8px),linear-gradient(180deg,#dfc9a4,#d6bf9a)}
.pol{
  background:linear-gradient(180deg,#fff,#fffaf3);
  padding:13px 13px 8px;border-radius:5px;
  box-shadow:0 28px 44px -24px rgba(43,32,32,.6),0 3px 9px rgba(43,32,32,.14);
  transition:transform .4s var(--ease),box-shadow .4s var(--ease);
}
.pol:hover{transform:translateY(-9px) rotate(.5deg) scale(1.03);box-shadow:0 40px 56px -24px rgba(43,32,32,.65),0 5px 12px rgba(43,32,32,.16)}
.pol figcaption{color:var(--wine);font-size:1.12rem;padding:10px 2px 6px}
.tape{width:44%;height:22px;top:-12px;rotate:-3deg;background:repeating-linear-gradient(135deg,#f3c6bfd9 0 7px,#fff6ecd9 7px 14px);opacity:.95}
.ph{background:linear-gradient(145deg,#f7dcd5,#efc4bb);color:#c9a15a}

/* ---- trái tim ghép ---- */
.ht{
  border-radius:30%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 6px 14px -8px rgba(43,32,32,.5);
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  transition:transform .5s var(--ease) var(--dl,0s),opacity .45s var(--dl,0s),box-shadow .3s,filter .3s;
}
.ht:hover,.ht:focus-visible{
  transform:scale(1.5) rotate(-2deg);z-index:5;
  box-shadow:0 16px 30px -10px rgba(43,32,32,.6),0 0 0 3px rgba(255,255,255,.85),0 0 24px 4px rgba(255,159,196,.65);
  filter:saturate(1.15) brightness(1.06);
}
.hcap{
  background:linear-gradient(165deg,#fffdf8,#f7ebd6);
  border:1px solid var(--hair);outline:1px solid rgba(201,161,90,.5);outline-offset:-8px;
  box-shadow:var(--lift);border-radius:18px;
  font-size:1.25rem;min-height:3.8em;
}

/* ---- thư bí mật ---- */
.s-blush{background:var(--blush2) radial-gradient(#6d1f3320 1.2px,transparent 1.6px) 0 0/12px 12px}
.mail{
  border-radius:8px;
  box-shadow:0 26px 38px -22px rgba(43,32,32,.6),0 3px 8px rgba(43,32,32,.16);
}
.mail::before{border-radius:5px}
.mail::after{border-radius:5px 5px 0 0}
.mail:hover{transform:translateY(-8px) rotate(-2deg);box-shadow:0 38px 50px -22px rgba(43,32,32,.65)}
.mail b{
  top:46%;
  box-shadow:0 0 0 2.5px rgba(255,255,255,.75),0 8px 16px -5px rgba(200,60,110,.7),0 0 20px 4px rgba(255,150,190,.55);
}
.sheet{
  background:#fffdf5;
  border:1px solid var(--hair);outline:1px solid rgba(201,161,90,.5);outline-offset:-10px;
  box-shadow:0 50px 100px -35px #000c;border-radius:12px;
}
.type{font-size:1.25rem}

/* ---- đoạn kết ---- */
.s-wine{background:radial-gradient(80% 70% at 50% 38%,#93304c 0,var(--wine) 55%,#3f0f1e 100%)}
.s-wine h1{color:#fff6e8;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.en{gap:26px}
.s-wine .btn{background:linear-gradient(135deg,#fffaf0,#f0ddb8);color:var(--wine)}
.fh{color:var(--blush2)}

/* ---- lightbox ---- */
.lb{background:#241418f0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.frame{background:linear-gradient(180deg,#fff,#fffaf2);padding:16px;border-radius:8px;box-shadow:0 40px 80px -25px #000d}
.lb .cap{color:var(--gold2);font-size:1.4rem}

/* ---- nhân vật & bong bóng ---- */
.fig img,.fig svg{filter:drop-shadow(0 8px 10px rgba(43,32,32,.3))}
.bub{
  background:linear-gradient(165deg,#fffdf8,#f9efdd);
  border:1.5px solid rgba(109,31,51,.3);
  box-shadow:0 18px 36px -14px rgba(109,31,51,.55);
  font-size:1.12rem;color:var(--wine);
}
.call{border:1.5px solid var(--gold);border-right:0;color:var(--red);background:linear-gradient(135deg,#fffaf0,#f3e2c2)}

/* ---- thanh điều hướng ---- */
.dots{
  background:rgba(255,250,240,.72);
  border:1px solid rgba(201,161,90,.6);
  box-shadow:0 18px 36px -16px rgba(109,31,51,.55);
  padding:12px 18px;gap:12px;
}

  /* ---------- hành tinh ---------- */

  var planets = null;

      { spr: makePlanet('rock', 3), x: 0.42, y: 0.13, s: 0.12, k: 0.5, rot: 0 },

  /* ---------- thiên thạch v3: đá khối nhiều mặt ---------- */
  function makeRock3(seed) {
    var r = mulberry(seed), S = 160, c = document.createElement('canvas'); c.width = c.height = S;
    var g = c.getContext('2d'), n = 9 + Math.floor(r() * 5), cx = S / 2, cy = S / 2, R = S * 0.44, el = 0.7 + 0.3 * r(), rot = r() * TAU, cr = Math.cos(rot), sr = Math.sin(rot);
    var Lx = 0.6, Ly = -0.5, Lz = 0.62, hue = r(), i, j, out = [], inn = [], ctr = [cx + Lx * R * 0.12, cy + Ly * R * 0.12];
    function P(a, rad, ox, oy) { var x = Math.cos(a) * rad, y = Math.sin(a) * rad * el; return [cx + ox + x * cr - y * sr, cy + oy + x * sr + y * cr]; }

      var dx = (mx - cx) / R, dy = (my - cy) / R, nz = Math.sqrt(Math.max(0.12, 1 - dx * dx - dy * dy));
      var nx = dx * 0.9 + (r() - 0.5) * 0.55, ny = dy * 0.9 + (r() - 0.5) * 0.55, nl = Math.hypot(nx, ny, nz);
      var l = Math.pow(clamp((nx * Lx + ny * Ly + nz * Lz) / nl + boost, 0, 1), 0.85);

    for (i = 0; i < n; i++) {
      j = (i + 1) % n; var mx = (out[i][0] + out[j][0]) / 2 - cx, my = (out[i][1] + out[j][1]) / 2 - cy, dd = (mx * Lx + my * Ly) / R;
      if (dd > 0.15) { g.strokeStyle = 'rgba(255,190,235,' + Math.min(0.85, dd) + ')'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(out[i][0], out[i][1]); g.lineTo(out[j][0], out[j][1]); g.stroke(); }
      g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(inn[i][0], inn[i][1]); g.lineTo(out[i][0], out[i][1]); g.stroke();
    }

  }
  function enterSky(t) { phase = 'sky'; skyT0 = t; flashDecayT0 = t; flash = 0; showSky(); }

  /* ---------- loop ---------- */
  var t0 = performance.now(), lastT = 0, slowN = 0, slowSum = 0, prepped = false;
  function setDpr(d) { DPR = d; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
  var fogTick = false;
  function frame(now) {
    if (siteOn) return;
    if (phase === 'fog' && fogBuilt && fogOn && (fogTick = !fogTick)) { requestAnimationFrame(frame); return; }

    }

    if (phase === 'zoom') {

      if (captionStage === 1 && camE > 0.4) { captionStage = 2; setCaption(T2); }
      if (camE >= 1) { phase = 'p1'; p1At = t; starBtn.disabled = false; setTimeout(function () { if (phase === 'p1') hintEl.classList.add('in'); }, 1400); }
